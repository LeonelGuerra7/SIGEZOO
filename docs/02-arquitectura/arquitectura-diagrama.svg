<svg width="680" height="470" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitectura de SIGEZOO</title>
<desc>Diagrama de bloques mostrando cliente, servidor web Apache, la aplicacion Laravel con sus capas de middleware, controladores y ORM, y la base de datos MySQL.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="230" y="40" width="220" height="50" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="70" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Cliente (navegador)</text>

<line x1="340" y1="90" x2="340" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="110" width="220" height="50" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Servidor web (Apache)</text>

<line x1="340" y1="160" x2="340" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="180" width="580" height="170" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="70" y="202" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Aplicación Laravel (PHP)</text>

<rect x="70" y="215" width="160" height="60" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="150" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Middleware</text>
<text x="150" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">auth, roles</text>

<rect x="260" y="215" width="160" height="60" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Controladores</text>
<text x="340" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">por módulo</text>

<rect x="450" y="215" width="160" height="60" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="530" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Eloquent ORM</text>
<text x="530" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">acceso a datos</text>

<line x1="340" y1="350" x2="340" y2="370" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="370" width="220" height="50" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="392" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Base de datos</text>
<text x="340" y="408" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">MySQL 8.4</text>

<rect x="60" y="426" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="78" y="436" font-family="sans-serif" font-size="12" fill="#444441">Infraestructura</text>
<rect x="203" y="426" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="221" y="436" font-family="sans-serif" font-size="12" fill="#444441">Seguridad</text>
<rect x="304" y="426" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="322" y="436" font-family="sans-serif" font-size="12" fill="#444441">Lógica de negocio</text>
<rect x="468" y="426" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="486" y="436" font-family="sans-serif" font-size="12" fill="#444441">Acceso a datos</text>
</svg>
